<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="favicon-32x32.png" type="image/png">
        <title>Coming soon!</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
            }

            html {
                display: table;
                font-family: Lato, "Segoe UI", Avenir, Ubuntu, Tahoma, Verdana, Helvetica, sans-serif;
            }

            body {
                display: table-cell;
                vertical-align: middle;
                text-align: center;
            }

            h1 {
                font-size: 4em;
                font-weight: normal;
                text-transform: lowercase;
            }

            svg {
                width: 250px;
                height: 250px;
            }

            .dot {
                animation-name: dot;
                animation-duration: 0.6s;
                animation-timing-function: ease-in-out;
                animation-iteration-count: infinite;
                animation-direction: alternate;
                opacity: 0;
            }

            .dot-2 {
                animation-delay: 0.2s;
            }

            .dot-3 {
                animation-delay: 0.4s;
            }

            .bounce {
                animation-name: bounce;
                animation-duration: 1.2s;
                animation-timing-function: ease-in-out;
                animation-iteration-count: infinite;
                animation-direction: alternate;
            }

            @keyframes dot {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            @keyframes bounce {
                from {
                    transform: scale(0.9);
                }
                to {
                    transform: scale(1);
                }
            }
        </style>
    </head>

    <body>
        <img class="bounce" src="Smiley.png" alt="Coming soon" style="width:250px;height:250px;object-fit:contain;">

        <h1>coming soon<span class="dot">.</span><span class="dot dot-2">.</span><span class="dot dot-3">.</span></h1>
    </body>

</html>
